<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BetterLife Zambia Limited - Portal Login</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0f172a;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }
    .brand-card {
      background: #ffffff;
      padding: 2.5rem;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      width: 340px;
    }
    .brand-card h1 {
      font-size: 1.4rem;
      color: #0284c7;
      text-align: center;
      margin-bottom: 0.2rem;
      font-weight: 800;
    }
    .brand-card p {
      font-size: 0.85rem;
      color: #64748b;
      text-align: center;
      margin-bottom: 1.8rem;
    }
    .form-group {
      margin-bottom: 1.2rem;
    }
    .form-group label {
      display: block;
      margin-bottom: 0.4rem;
      color: #334155;
      font-size: 0.9rem;
      font-weight: 600;
    }
    .form-group input {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid #cbd5e1;
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 0.95rem;
    }
    button {
      width: 100%;
      padding: 0.8rem;
      background-color: #0284c7;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background-color: #0369a1;
    }
    #message {
      margin-top: 1.2rem;
      text-align: center;
      font-size: 0.9rem;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="brand-card">
    <h1>BetterLife Zambia</h1>
    <p>Financial Solutions & Services Portal</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="username">NRC / Phone / Username</label>
        <input type="text" id="username" name="username" placeholder="Enter credential" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter password" required>
      </div>
      <button type="submit">Access Account</button>
    </form>
    <div id="message"></div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const usernameInput = document.getElementById('username').value.trim();
      const passwordInput = document.getElementById('password').value.trim();
      const messageDiv = document.getElementById('message');

      messageDiv.textContent = 'Verifying BetterLife Credentials...';
      messageDiv.style.color = '#0284c7';

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: usernameInput, password: passwordInput })
        });

        const data = await response.json();

        if (response.ok && data.success) {
          messageDiv.style.color = '#16a34a';
          messageDiv.textContent = 'Login Authorized! Opening Portal...';
          
          localStorage.setItem('betterlife_user', JSON.stringify(data.user));

          setTimeout(() => {
            window.location.href = '/index.html';
          }, 1000);
        } else {
          messageDiv.style.color = '#dc2626';
          messageDiv.textContent = data.error || 'Access Denied.';
        }
      } catch (err) {
        messageDiv.style.color = '#dc2626';
        messageDiv.textContent = 'Connection error. Check network and try again.';
      }
    });
  </script>

</body>
</html>
